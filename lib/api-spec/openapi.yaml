openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: work-items
    description: Persistent contract work items
  - name: references
    description: Searchable contract reference documents
  - name: workspace
    description: Current organization workspace and membership
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /work-items:
    get:
      operationId: listWorkItems
      tags: [work-items]
      summary: List work items
      parameters:
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/WorkItemCategory"
      responses:
        "200":
          description: Work items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItem"
    post:
      operationId: createWorkItem
      tags: [work-items]
      summary: Create a work item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemInput"
      responses:
        "201":
          description: Created work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400":
          $ref: "#/components/responses/BadRequest"
  /work-items/{id}:
    patch:
      operationId: updateWorkItem
      tags: [work-items]
      summary: Update a work item
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemUpdate"
      responses:
        "200":
          description: Updated work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get the authenticated user's workspace
      responses:
        "200":
          description: Active workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      summary: Rename the active workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
  /workspace/members:
    get:
      operationId: listWorkspaceMembers
      tags: [workspace]
      summary: List members of the active workspace
      responses:
        "200":
          description: Workspace members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
  /workspace/invitations:
    post:
      operationId: createWorkspaceInvitation
      tags: [workspace]
      summary: Create a one-time member invitation
      responses:
        "201":
          description: Invitation token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
  /workspace/invitations/accept:
    post:
      operationId: acceptWorkspaceInvitation
      tags: [workspace]
      summary: Join a workspace with an invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationAccept"
      responses:
        "200":
          description: Joined workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
  /references:
    get:
      operationId: listReferences
      tags: [references]
      summary: List indexed reference documents
      responses:
        "200":
          description: Indexed documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceDocument"
  /references/search:
    get:
      operationId: searchReferences
      tags: [references]
      summary: Search reference document contents
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: Matching excerpts with source context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  parameters:
    WorkItemId:
      in: path
      name: id
      required: true
      schema:
        type: number
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Item not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    WorkspaceRole:
      type: string
      enum: [manager, member]
    Workspace:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: number
        name:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    WorkspaceUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
    WorkspaceMember:
      type: object
      required: [id, displayName, role]
      properties:
        id:
          type: number
        displayName:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    WorkspaceInvitation:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    WorkspaceInvitationAccept:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
    WorkItemCategory:
      type: string
      enum: [administration, decision, evidence, risk]
    WorkItemStatus:
      type: string
      enum: [Perlu ditinjau, Berjalan, Selesai]
    WorkItem:
      type: object
      required: [id, category, title, status, kind, completed, createdAt, updatedAt]
      properties:
        id:
          type: number
        category:
          $ref: "#/components/schemas/WorkItemCategory"
        title:
          type: string
        description:
          type: ["string", "null"]
        project:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        due:
          type: ["string", "null"]
        kind:
          type: string
        competencyArea:
          type: ["string", "null"]
        completed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkItemInput:
      type: object
      required: [category, title, kind]
      properties:
        category:
          $ref: "#/components/schemas/WorkItemCategory"
        title:
          type: string
          minLength: 1
        description:
          type: string
        project:
          type: string
        owner:
          type: string
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        due:
          type: string
        kind:
          type: string
          minLength: 1
        competencyArea:
          type: string
        completed:
          type: boolean
    WorkItemUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        project:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        due:
          type: ["string", "null"]
        kind:
          type: string
          minLength: 1
        competencyArea:
          type: ["string", "null"]
        completed:
          type: boolean
    ReferenceDocument:
      type: object
      required: [id, title, category, fileType, sourceFilename, sourceChecksum, sectionCount, topics]
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        fileType:
          type: string
        sourceFilename:
          type: string
        sourceChecksum:
          type: string
        sectionCount:
          type: number
        topics:
          type: array
          items:
            type: string
    ReferenceSearchHit:
      type: object
      required: [id, documentId, title, category, fileType, sourceFilename, sourceChecksum, sectionNumber, heading, excerpt, topics]
      properties:
        id:
          type: string
        documentId:
          type: string
        title:
          type: string
        category:
          type: string
        fileType:
          type: string
        sourceFilename:
          type: string
        sourceChecksum:
          type: string
        sectionNumber:
          type: number
        heading:
          type: string
        excerpt:
          type: string
        topics:
          type: array
          items:
            type: string
    ReferenceSearchResponse:
      type: object
      required: [query, total, results, disclaimer]
      properties:
        query:
          type: string
        total:
          type: number
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceSearchHit"
        disclaimer:
          type: string

