          type: ["string", "null"]
        sectionCount:
          type: number
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: ["string", "null"]
          format: date-time
        archivedAt:
          type: ["string", "null"]
          format: date-time
        replacesDocumentId:
          type: ["number", "null"]
        replacedByDocumentId:
          type: ["number", "null"]
