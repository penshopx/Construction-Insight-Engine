openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: work-items
    description: Persistent contract work items
  - name: references
    description: Searchable contract reference documents
  - name: workspace
    description: Current organization workspace and membership
  - name: contract-cases
    description: Guided contractual case workflows
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /work-items:
    get:
      operationId: listWorkItems
      tags: [work-items]
      summary: List work items
      parameters:
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/WorkItemCategory"
      responses:
        "200":
          description: Work items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItem"
    post:
      operationId: createWorkItem
      tags: [work-items]
      summary: Create a work item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemInput"
      responses:
        "201":
          description: Created work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400":
          $ref: "#/components/responses/BadRequest"
  /work-items/{id}:
    patch:
      operationId: updateWorkItem
      tags: [work-items]
      summary: Update a work item
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemUpdate"
      responses:
        "200":
          description: Updated work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /contract-cases:
    get:
      operationId: listContractCases
      tags: [contract-cases]
      summary: List contractual cases
      responses:
        "200":
          description: Contractual cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractCase"
    post:
      operationId: createContractCase
      tags: [contract-cases]
      summary: Create a guided contractual case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCaseInput"
      responses:
        "201":
          description: Created contractual case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractCase"
        "400":
          $ref: "#/components/responses/BadRequest"
  /contract-cases/{id}:
    patch:
      operationId: updateContractCase
      tags: [contract-cases]
      summary: Update a contractual case and record its history
      parameters:
        - $ref: "#/components/parameters/ContractCaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCaseUpdate"
      responses:
        "200":
          description: Updated contractual case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /contract-cases/{id}/activities:
    get:
      operationId: listContractCaseActivities
      tags: [contract-cases]
      summary: List the case change history
      parameters:
        - $ref: "#/components/parameters/ContractCaseId"
      responses:
        "200":
          description: Case history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractCaseActivity"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get the authenticated user's workspace
      responses:
        "200":
          description: Active workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      summary: Rename the active workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
  /workspace/members:
    get:
      operationId: listWorkspaceMembers
      tags: [workspace]
      summary: List members of the active workspace
      responses:
        "200":
          description: Workspace members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
  /workspace/invitations:
    post:
      operationId: createWorkspaceInvitation
      tags: [workspace]
      summary: Create a one-time member invitation
      responses:
        "201":
          description: Invitation token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
  /workspace/invitations/accept:
    post:
      operationId: acceptWorkspaceInvitation
      tags: [workspace]
      summary: Join a workspace with an invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationAccept"
      responses:
        "200":
          description: Joined workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
  /references:
    get:
      operationId: listReferences
      tags: [references]
      summary: List indexed reference documents
      responses:
        "200":
          description: Indexed documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceDocument"
  /references/uploads/request-url:
    post:
      operationId: requestReferenceUploadUrl
      tags: [references]
      summary: Request a manager-only upload URL for a reference source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceUploadRequest"
      responses:
        "200":
          description: Presigned upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /references/imports:
    get:
      operationId: listReferenceImports
      tags: [references]
      summary: List manager-visible reference processing jobs
      responses:
        "200":
          description: Reference processing jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceImport"
    post:
      operationId: createReferenceImport
      tags: [references]
      summary: Start extracting an uploaded reference source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceImportInput"
      responses:
        "202":
          description: Extraction started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceImport"
        "400":
          $ref: "#/components/responses/BadRequest"
  /references/search:
    get:
      operationId: searchReferences
      tags: [references]
      summary: Search reference document contents
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: Matching excerpts with source context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  parameters:
    WorkItemId:
      in: path
      name: id
      required: true
      schema:
        type: number
    ContractCaseId:
      in: path
      name: id
      required: true
      schema:
        type: number
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Item not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    WorkspaceRole:
      type: string
      enum: [manager, member]
    Workspace:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: number
        name:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    WorkspaceUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
    WorkspaceMember:
      type: object
      required: [id, displayName, role]
      properties:
        id:
          type: number
        displayName:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    WorkspaceInvitation:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    WorkspaceInvitationAccept:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
    WorkItemCategory:
      type: string
      enum: [administration, decision, evidence, risk]
    WorkItemStatus:
      type: string
      enum: [Perlu ditinjau, Berjalan, Selesai]
    WorkItem:
      type: object
      required: [id, category, title, status, kind, completed, createdAt, updatedAt]
      properties:
        id:
          type: number
        category:
          $ref: "#/components/schemas/WorkItemCategory"
        title:
          type: string
        description:
          type: ["string", "null"]
        project:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        due:
          type: ["string", "null"]
        kind:
          type: string
        competencyArea:
          type: ["string", "null"]
        completed:
          type: boolean
        caseId:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkItemInput:
      type: object
      required: [category, title, kind]
      properties:
        category:
          $ref: "#/components/schemas/WorkItemCategory"
        title:
          type: string
          minLength: 1
        description:
          type: string
        project:
          type: string
        owner:
          type: string
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        due:
          type: string
        kind:
          type: string
          minLength: 1
        competencyArea:
          type: string
        completed:
          type: boolean
        caseId:
          type: number
    WorkItemUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        project:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        due:
          type: ["string", "null"]
        kind:
          type: string
          minLength: 1
        competencyArea:
          type: ["string", "null"]
        completed:
          type: boolean
        caseId:
          type: ["number", "null"]
    ContractCaseType:
      type: string
      enum: [VO, EOT, CLAIM, NCR]
    ContractCaseStatus:
      type: string
      enum: [Draft, Active, Under Review, Decided, Closed]
    ContractCaseEvidence:
      type: object
      required: [name]
      properties:
        name:
          type: string
        note:
          type: string
    ContractCase:
      type: object
      required: [id, reference, type, title, project, eventDate, clauseBasis, description, currentStage, status, typeDetails, evidence, createdAt, updatedAt]
      properties:
        id:
          type: number
        reference:
          type: string
        type:
          $ref: "#/components/schemas/ContractCaseType"
        title:
          type: string
        project:
          type: string
        eventDate:
          type: string
          format: date
        noticeDueDate:
          type: ["string", "null"]
          format: date
        clauseBasis:
          type: string
        description:
          type: string
        impactValue:
          type: ["string", "null"]
        currentStage:
          type: number
        status:
          $ref: "#/components/schemas/ContractCaseStatus"
        owner:
          type: ["string", "null"]
        typeDetails:
          type: object
          additionalProperties:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ContractCaseEvidence"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContractCaseInput:
      type: object
      required: [type, title, project, eventDate, clauseBasis, description, typeDetails]
      properties:
        type:
          $ref: "#/components/schemas/ContractCaseType"
        title:
          type: string
          minLength: 2
        project:
          type: string
          minLength: 2
        eventDate:
          type: string
          format: date
        noticeDueDate:
          type: string
          format: date
        clauseBasis:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 2
        impactValue:
          type: string
        owner:
          type: string
        typeDetails:
          type: object
          additionalProperties:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ContractCaseEvidence"
    ContractCaseUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 2
        project:
          type: string
        noticeDueDate:
          type: ["string", "null"]
          format: date
        clauseBasis:
          type: string
        description:
          type: string
        impactValue:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        currentStage:
          type: number
          minimum: 0
          maximum: 4
        status:
          $ref: "#/components/schemas/ContractCaseStatus"
        typeDetails:
          type: object
          additionalProperties:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ContractCaseEvidence"
        changeNote:
          type: string
    ContractCaseActivity:
      type: object
      required: [id, action, detail, createdAt]
      properties:
        id:
          type: number
        action:
          type: string
        detail:
          type: string
        actor:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    ReferenceDocument:
      type: object
      required: [id, title, category, fileType, sourceFilename, sourceChecksum, sectionCount, topics]
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        fileType:
          type: string
        sourceFilename:
          type: string
        sourceChecksum:
          type: string
        sectionCount:
          type: number
        topics:
          type: array
          items:
            type: string
    ReferenceProcessingStatus:
      type: string
      enum: [processing, ready, failed]
    ReferenceUploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
          maximum: 20971520
        contentType:
          type: string
          minLength: 1
    ReferenceUploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
    ReferenceImportInput:
      type: object
      required: [objectPath, sourceFilename]
      properties:
        objectPath:
          type: string
          pattern: "^/objects/uploads/org-[0-9]+-[a-f0-9-]+$"
        sourceFilename:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
    ReferenceImport:
      type: object
      required: [id, title, category, fileType, sourceFilename, status, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        category:
          type: string
        fileType:
          type: string
        sourceFilename:
          type: string
        status:
          $ref: "#/components/schemas/ReferenceProcessingStatus"
        error:
          type: ["string", "null"]
        sectionCount:
          type: number
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: ["string", "null"]
          format: date-time
    ReferenceSearchHit:
      type: object
      required: [id, documentId, title, category, fileType, sourceFilename, sourceChecksum, sectionNumber, heading, excerpt, topics]
      properties:
        id:
          type: string
        documentId:
          type: string
        title:
          type: string
        category:
          type: string
        fileType:
          type: string
        sourceFilename:
          type: string
        sourceChecksum:
          type: string
        sectionNumber:
          type: number
        heading:
          type: string
        excerpt:
          type: string
        topics:
          type: array
          items:
            type: string
    ReferenceSearchResponse:
      type: object
      required: [query, total, results, disclaimer]
      properties:
        query:
          type: string
        total:
          type: number
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceSearchHit"
        disclaimer:
          type: string

