openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: work-items
    description: Persistent contract work items
  - name: references
    description: Searchable contract reference documents
  - name: workspace
    description: Current organization workspace and membership
  - name: contract-cases
    description: Guided contractual case workflows
  - name: collaboration
    description: Shared expert review and mediation workspaces
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /work-items:
    get:
      operationId: listWorkItems
      tags: [work-items]
      summary: List work items
      parameters:
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/WorkItemCategory"
      responses:
        "200":
          description: Work items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItem"
    post:
      operationId: createWorkItem
      tags: [work-items]
      summary: Create a work item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemInput"
      responses:
        "201":
          description: Created work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400":
          $ref: "#/components/responses/BadRequest"
  /work-items/{id}:
    patch:
      operationId: updateWorkItem
      tags: [work-items]
      summary: Update a work item
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemUpdate"
      responses:
        "200":
          description: Updated work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /contract-cases:
    get:
      operationId: listContractCases
      tags: [contract-cases]
      summary: List contractual cases
      responses:
        "200":
          description: Contractual cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractCase"
    post:
      operationId: createContractCase
      tags: [contract-cases]
      summary: Create a guided contractual case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCaseInput"
      responses:
        "201":
          description: Created contractual case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractCase"
        "400":
          $ref: "#/components/responses/BadRequest"
  /contract-cases/{id}:
    patch:
      operationId: updateContractCase
      tags: [contract-cases]
      summary: Update a contractual case and record its history
      parameters:
        - $ref: "#/components/parameters/ContractCaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCaseUpdate"
      responses:
        "200":
          description: Updated contractual case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /contract-cases/{id}/activities:
    get:
      operationId: listContractCaseActivities
      tags: [contract-cases]
      summary: List the case change history
      parameters:
        - $ref: "#/components/parameters/ContractCaseId"
      responses:
        "200":
          description: Case history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractCaseActivity"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get the authenticated user's workspace
      responses:
        "200":
          description: Active workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      summary: Rename the active workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
  /workspace/members:
    get:
      operationId: listWorkspaceMembers
      tags: [workspace]
      summary: List members of the active workspace
      responses:
        "200":
          description: Workspace members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
  /workspace/invitations:
    post:
      operationId: createWorkspaceInvitation
      tags: [workspace]
      summary: Create a one-time member invitation
      responses:
        "201":
          description: Invitation token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
  /workspace/invitations/accept:
    post:
      operationId: acceptWorkspaceInvitation
      tags: [workspace]
      summary: Join a workspace with an invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationAccept"
      responses:
        "200":
          description: Joined workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
  /references:
    get:
      operationId: listReferences
      tags: [references]
      summary: List indexed reference documents
      responses:
        "200":
          description: Indexed documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceDocument"
  /references/uploads/request-url:
    post:
      operationId: requestReferenceUploadUrl
      tags: [references]
      summary: Request a manager-only upload URL for a reference source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceUploadRequest"
      responses:
        "200":
          description: Presigned upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /references/imports:
    get:
      operationId: listReferenceImports
      tags: [references]
      summary: List manager-visible reference processing jobs
      responses:
        "200":
          description: Reference processing jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceImport"
    post:
      operationId: createReferenceImport
      tags: [references]
      summary: Start extracting an uploaded reference source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceImportInput"
      responses:
        "202":
          description: Extraction started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceImport"
        "400":
          $ref: "#/components/responses/BadRequest"
  /references/imports/{id}/archive:
    post:
      operationId: archiveReferenceImport
      tags: [references]
      summary: Archive a manager-owned reference without deleting its history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Archived reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /references/search:
    get:
      operationId: searchReferences
      tags: [references]
      summary: Search reference document contents
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: Matching excerpts with source context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /collaboration/failure-cases:
    get:
      operationId: listFailureCases
      tags: [collaboration]
      responses:
        "200":
          description: Persistent failure cases
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FailureCase" } }
    post:
      operationId: createFailureCase
      tags: [collaboration]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/FailureCaseInput" } }
      responses:
        "201":
          description: Created failure case
          content:
            application/json: { schema: { $ref: "#/components/schemas/FailureCase" } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /collaboration/expert-assignments:
    get:
      operationId: listExpertAssignments
      tags: [collaboration]
      responses:
        "200":
          description: Expert assignments
          content:
            application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ExpertAssignment" } } }
    post:
      operationId: createExpertAssignment
      tags: [collaboration]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ExpertAssignmentInput" } }
      responses:
        "201":
          description: Created assignment
          content:
            application/json: { schema: { $ref: "#/components/schemas/ExpertAssignment" } }
  /collaboration/expert-assignments/{id}:
    patch:
      operationId: updateExpertAssignment
      tags: [collaboration]
      parameters: [{ $ref: "#/components/parameters/CollaborationId" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ExpertAssignmentUpdate" } }
      responses:
        "200":
          description: Updated assignment
          content:
            application/json: { schema: { $ref: "#/components/schemas/ExpertAssignment" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /collaboration/mediation-rooms:
    get:
      operationId: listMediationRooms
      tags: [collaboration]
      responses:
        "200":
          description: Mediation rooms
          content:
            application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MediationRoom" } } }
    post:
      operationId: createMediationRoom
      tags: [collaboration]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MediationRoomInput" } }
      responses:
        "201":
          description: Created mediation room
          content:
            application/json: { schema: { $ref: "#/components/schemas/MediationRoom" } }
  /collaboration/mediation-rooms/{id}:
    get:
      operationId: getMediationRoom
      tags: [collaboration]
      parameters: [{ $ref: "#/components/parameters/CollaborationId" }]
      responses:
        "200":
          description: Room aggregate
          content:
            application/json: { schema: { $ref: "#/components/schemas/MediationRoomAggregate" } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateMediationRoom
      tags: [collaboration]
      parameters: [{ $ref: "#/components/parameters/CollaborationId" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MediationRoomUpdate" } }
      responses:
        "200":
          description: Updated room
          content:
            application/json: { schema: { $ref: "#/components/schemas/MediationRoom" } }
  /collaboration/mediation-rooms/{id}/participants:
    post:
      operationId: addMediationParticipant
      tags: [collaboration]
      parameters: [{ $ref: "#/components/parameters/CollaborationId" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MediationParticipantInput" } }
      responses:
        "201":
          description: Added participant
          content:
            application/json: { schema: { $ref: "#/components/schemas/MediationParticipant" } }
  /collaboration/mediation-rooms/{id}/sessions:
    post:
      operationId: addMediationSession
      tags: [collaboration]
      parameters: [{ $ref: "#/components/parameters/CollaborationId" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MediationSessionInput" } }
      responses:
        "201":
          description: Added session
          content:
            application/json: { schema: { $ref: "#/components/schemas/MediationSession" } }
  /collaboration/mediation-rooms/{id}/issues:
    post:
      operationId: addMediationIssue
      tags: [collaboration]
      parameters: [{ $ref: "#/components/parameters/CollaborationId" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MediationIssueInput" } }
      responses:
        "201":
          description: Added issue
          content:
            application/json: { schema: { $ref: "#/components/schemas/MediationIssue" } }
  /collaboration/mediation-issues/{id}:
    patch:
      operationId: updateMediationIssue
      tags: [collaboration]
      parameters: [{ $ref: "#/components/parameters/CollaborationId" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MediationIssueUpdate" } }
      responses:
        "200":
          description: Updated issue
          content:
            application/json: { schema: { $ref: "#/components/schemas/MediationIssue" } }
  /collaboration/mediation-rooms/{id}/evidence:
    post:
      operationId: addMediationEvidence
      tags: [collaboration]
      parameters: [{ $ref: "#/components/parameters/CollaborationId" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MediationEvidenceInput" } }
      responses:
        "201":
          description: Added evidence metadata
          content:
            application/json: { schema: { $ref: "#/components/schemas/MediationEvidence" } }
components:
  parameters:
    WorkItemId:
      in: path
      name: id
      required: true
      schema:
        type: number
    ContractCaseId:
      in: path
      name: id
      required: true
      schema:
        type: number
    CollaborationId:
      in: path
      name: id
      required: true
      schema: { type: number }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Item not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        missingItems:
          type: array
          items:
            $ref: "#/components/schemas/ContractCaseChecklistItem"
    WorkspaceRole:
      type: string
      enum: [manager, member]
    Workspace:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: number
        name:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    WorkspaceUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
    WorkspaceMember:
      type: object
      required: [id, displayName, role]
      properties:
        id:
          type: number
        displayName:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    WorkspaceInvitation:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    WorkspaceInvitationAccept:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
    WorkItemCategory:
      type: string
      enum: [administration, decision, evidence, risk]
    WorkItemStatus:
      type: string
      enum: [Perlu ditinjau, Berjalan, Selesai]
    WorkItem:
      type: object
      required: [id, category, title, status, kind, completed, reminderDays, reminderSentDays, createdAt, updatedAt]
      properties:
        id:
          type: number
        category:
          $ref: "#/components/schemas/WorkItemCategory"
        title:
          type: string
        description:
          type: ["string", "null"]
        project:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        due:
          type: ["string", "null"]
        kind:
          type: string
        competencyArea:
          type: ["string", "null"]
        completed:
          type: boolean
        reminderDays:
          type: array
          items:
            type: number
            multipleOf: 1
            minimum: 0
        reminderSentDays:
          type: array
          items:
            type: number
            multipleOf: 1
            minimum: 0
        caseId:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkItemInput:
      type: object
      required: [category, title, kind]
      properties:
        category:
          $ref: "#/components/schemas/WorkItemCategory"
        title:
          type: string
          minLength: 1
        description:
          type: string
        project:
          type: string
        owner:
          type: string
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        due:
          type: string
        kind:
          type: string
          minLength: 1
        competencyArea:
          type: string
        completed:
          type: boolean
        caseId:
          type: number
        reminderDays:
          type: array
          uniqueItems: true
          maxItems: 8
          items:
            type: number
            multipleOf: 1
            minimum: 0
            maximum: 365
    WorkItemUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        project:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        due:
          type: ["string", "null"]
        kind:
          type: string
          minLength: 1
        competencyArea:
          type: ["string", "null"]
        completed:
          type: boolean
        caseId:
          type: ["number", "null"]
        reminderDays:
          type: array
          uniqueItems: true
          maxItems: 8
          items:
            type: number
            multipleOf: 1
            minimum: 0
            maximum: 365
    ContractCaseType:
      type: string
      enum: [VO, EOT, CLAIM, NCR]
    ContractCaseStatus:
      type: string
      enum: [Draft, Active, Under Review, Decided, Closed]
    ContractCaseEvidence:
      type: object
      required: [name]
      properties:
        name:
          type: string
        note:
          type: string
    ContractCaseChecklistItem:
      type: object
      required: [key, label, target]
      properties:
        key:
          type: string
        label:
          type: string
        target:
          type: string
    ContractCaseStageChecklist:
      type: object
      required: [stage, title, complete, items]
      properties:
        stage:
          type: number
        title:
          type: string
        complete:
          type: boolean
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ContractCaseChecklistItem"
              - type: object
                required: [complete]
                properties:
                  complete:
                    type: boolean
    ContractCase:
      type: object
      required: [id, reference, type, title, project, eventDate, clauseBasis, description, currentStage, status, typeDetails, evidence, stageChecklist, createdAt, updatedAt]
      properties:
        id:
          type: number
        reference:
          type: string
        type:
          $ref: "#/components/schemas/ContractCaseType"
        title:
          type: string
        project:
          type: string
        eventDate:
          type: string
          format: date
        noticeDueDate:
          type: ["string", "null"]
          format: date
        noticeReference:
          type: ["string", "null"]
        clauseBasis:
          type: string
        description:
          type: string
        impactValue:
          type: ["string", "null"]
        currentStage:
          type: number
        status:
          $ref: "#/components/schemas/ContractCaseStatus"
        owner:
          type: ["string", "null"]
        typeDetails:
          type: object
          additionalProperties:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ContractCaseEvidence"
        reviewNotes:
          type: ["string", "null"]
        decisionOutcome:
          type: ["string", "null"]
        stageChecklist:
          type: array
          items:
            $ref: "#/components/schemas/ContractCaseStageChecklist"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContractCaseInput:
      type: object
      required: [type, title, project, eventDate, clauseBasis, description, typeDetails]
      properties:
        type:
          $ref: "#/components/schemas/ContractCaseType"
        title:
          type: string
          minLength: 2
        project:
          type: string
          minLength: 2
        eventDate:
          type: string
          format: date
        noticeDueDate:
          type: string
          format: date
        clauseBasis:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 2
        impactValue:
          type: string
        owner:
          type: string
        typeDetails:
          type: object
          additionalProperties:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ContractCaseEvidence"
    ContractCaseUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 2
        project:
          type: string
        noticeDueDate:
          type: ["string", "null"]
          format: date
        noticeReference:
          type: ["string", "null"]
        clauseBasis:
          type: string
        description:
          type: string
        impactValue:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        currentStage:
          type: number
          minimum: 0
          maximum: 4
        status:
          $ref: "#/components/schemas/ContractCaseStatus"
        typeDetails:
          type: object
          additionalProperties:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ContractCaseEvidence"
        reviewNotes:
          type: ["string", "null"]
        decisionOutcome:
          type: ["string", "null"]
        changeNote:
          type: string
    ContractCaseActivity:
      type: object
      required: [id, action, detail, createdAt]
      properties:
        id:
          type: number
        action:
          type: string
        detail:
          type: string
        actor:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    FailureCase:
      type: object
      required: [id, project, reference, title, category, severity, description, status, eventDate, createdAt, updatedAt]
      properties:
        id: { type: number }
        caseId: { type: ["number", "null"] }
        project: { type: string }
        reference: { type: string }
        title: { type: string }
        category: { type: string }
        severity: { type: string }
        description: { type: string }
        status: { type: string }
        eventDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FailureCaseInput:
      type: object
      required: [project, title, category, description, eventDate]
      properties:
        caseId: { type: number }
        project: { type: string, minLength: 1 }
        title: { type: string, minLength: 2 }
        category: { type: string, minLength: 1 }
        severity: { type: string }
        description: { type: string, minLength: 2 }
        eventDate: { type: string, format: date }
    ExpertAssignment:
      type: object
      required: [id, expertName, role, scope, status, conflictStatus, createdAt, updatedAt]
      properties:
